[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pomona-demeter"
version = "0.1.0"
description = "Demeter - the pomona autodosing controller (k3s brain, cards #278/#224)"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.0,<3",
    "prometheus-client>=0.20",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["demeter*"]
